<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">NetSentinel system architecture</title><desc id="desc">Architecture from network capture through C++ engine and Python backend to Supabase and Next.js.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#123d5b"/><stop offset="1" stop-color="#164e63"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#123e39"/><stop offset="1" stop-color="#14532d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#7dd3fc"/></marker></defs>
<rect width="1400" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="700" y="75" fill="#e2f3ff" font-size="38" font-weight="800">NETSENTINEL — SYSTEM ARCHITECTURE</text><text x="700" y="112" fill="#8caec5" font-size="19">Modular packet processing and real-time network intelligence</text>
<rect x="400" y="155" width="600" height="100" rx="18" fill="#172b43" stroke="#64748b" stroke-width="2"/><text x="700" y="197" fill="#f8fafc" font-size="27" font-weight="700">Network Interface / PCAP</text><text x="700" y="228" fill="#b6c9d8" font-size="17">Live capture or offline packet file</text>
<path d="M700 255V305" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="300" y="315" width="800" height="125" rx="18" fill="url(#blue)" stroke="#38bdf8" stroke-width="2"/><text x="700" y="362" fill="#f0f9ff" font-size="30" font-weight="700">C++ Packet Engine</text><text x="700" y="398" fill="#c5eaff" font-size="19">libpcap · Protocol parsing · DPI metadata · Bidirectional flows</text>
<path d="M700 440V490" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/><text x="820" y="472" fill="#9bc7dc" font-size="16">JSON Lines / IPC</text>
<rect x="300" y="500" width="800" height="130" rx="18" fill="#25354a" stroke="#a78bfa" stroke-width="2"/><text x="700" y="550" fill="#f8fafc" font-size="30" font-weight="700">Python Backend · FastAPI</text><text x="700" y="590" fill="#d8d1ff" font-size="19">Event validation · Aggregation · Detection rules · REST APIs</text>
<path d="M500 630V680H300V710M900 630V680H1100V710" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="90" y="720" width="420" height="115" rx="18" fill="url(#green)" stroke="#34d399" stroke-width="2"/><text x="300" y="765" fill="#ecfdf5" font-size="27" font-weight="700">Supabase PostgreSQL</text><text x="300" y="800" fill="#bbf7d0" font-size="18">Sessions · Flows · DNS · Alerts · Metrics</text>
<rect x="890" y="720" width="420" height="115" rx="18" fill="#172f4a" stroke="#60a5fa" stroke-width="2"/><text x="1100" y="765" fill="#eff6ff" font-size="27" font-weight="700">Next.js Dashboard</text><text x="1100" y="800" fill="#bfdbfe" font-size="18">Overview · Packets · Flows · Threats</text>
<path d="M510 777H890" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="700" y="758" fill="#9bc7dc" font-size="15">Authenticated API + WebSocket updates</text></g></svg>